<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Circular container background -->
  <circle cx="60" cy="60" r="56" fill="#E8F5E9" stroke="#348E38" stroke-width="3"/>
  
  <!-- Subtle inner decorative ring -->
  <circle cx="60" cy="60" r="51" fill="none" stroke="#A5D6A7" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Waste Collection Truck (Truk Pengepul) -->
  <g transform="translate(18, 30)">
    <!-- Recycling Symbol on Top / Bed -->
    <g transform="translate(24, 0) scale(0.7)">
      <!-- Recycle Arrows in circular flow -->
      <path d="M 18 2 L 23 8 L 19.5 8 C 24 12 25 18 22 23 L 19 21 C 21.5 17 20.5 12.5 17 9.5 L 17 13 Z" fill="#348E38"/>
      <path d="M 27 22 L 27 28 L 24 25.5 C 19.5 28 13.5 27 10 23 L 12.5 20.5 C 15.5 23.5 20 24 23.5 22 L 20 22 Z" fill="#2E7D32"/>
      <path d="M 8 20 L 3 15 L 6.5 15 C 4 10 6 4 11 1 L 13.5 3.5 C 9.5 6 8 10.5 10 14.5 L 10 11 Z" fill="#1B5E20"/>
    </g>

    <!-- Cargo Bed / Boxes (Sorted Recyclables) -->
    <rect x="5" y="16" width="16" height="12" rx="1.5" fill="#81C784" stroke="#2E7D32" stroke-width="1.5"/>
    <line x1="5" y1="22" x2="21" y2="22" stroke="#2E7D32" stroke-width="1"/>
    <line x1="13" y1="16" x2="13" y2="28" stroke="#2E7D32" stroke-width="1"/>

    <rect x="18" y="18" width="18" height="10" rx="1.5" fill="#A5D6A7" stroke="#2E7D32" stroke-width="1.5"/>
    <line x1="18" y1="23" x2="36" y2="23" stroke="#2E7D32" stroke-width="1"/>

    <!-- Truck Cargo Body (Bak Truk Pengepul) -->
    <path d="M 2 28 L 44 28 L 44 42 L 2 42 Z" fill="#348E38" stroke="#1B5E20" stroke-width="2"/>
    <!-- Cargo ribs -->
    <line x1="12" y1="28" x2="12" y2="42" stroke="#2E7D32" stroke-width="1.5"/>
    <line x1="22" y1="28" x2="22" y2="42" stroke="#2E7D32" stroke-width="1.5"/>
    <line x1="32" y1="28" x2="32" y2="42" stroke="#2E7D32" stroke-width="1.5"/>

    <!-- Truck Cab (Kepala Truk) -->
    <path d="M 44 32 L 56 32 L 64 38 L 68 40 L 68 48 L 44 48 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
    <!-- Windshield & Window -->
    <path d="M 48 34 L 56 34 L 62 39 L 48 39 Z" fill="#E8F5E9" stroke="#1B5E20" stroke-width="1.5"/>
    <!-- Headlight -->
    <rect x="66" y="43" width="3" height="3" rx="0.5" fill="#FFD54F"/>
    <!-- Bumper -->
    <rect x="65" y="47" width="5" height="3" rx="1" fill="#757575"/>

    <!-- Chassis Base -->
    <rect x="0" y="44" width="67" height="4" fill="#424242"/>

    <!-- Left Wheel Well & Wheel -->
    <circle cx="16" cy="48" r="8" fill="#212121"/>
    <circle cx="16" cy="48" r="4.5" fill="#BDBDBD"/>
    <circle cx="16" cy="48" r="2" fill="#212121"/>

    <!-- Right Wheel Well & Wheel -->
    <circle cx="54" cy="48" r="8" fill="#212121"/>
    <circle cx="54" cy="48" r="4.5" fill="#BDBDBD"/>
    <circle cx="54" cy="48" r="2" fill="#212121"/>
  </g>

  <!-- Bottom Label / Accent -->
  <text x="60" y="102" font-family="'Jost', 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#0F4229" text-anchor="middle" letter-spacing="1.5">PENGEPUL</text>
</svg>
